spring.application.name=api-gateway

spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}

# Service URLs (override via environment variables in Railway)
services.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.user-service.url=${USER_SERVICE_URL:http://localhost:8087}
services.report-service.url=${REPORT_SERVICE_URL:http://localhost:8082}
services.support-service.url=${SUPPORT_SERVICE_URL:http://localhost:8083}
services.ai-service.url=${AI_SERVICE_URL:http://localhost:8084}
services.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
services.analytics-service.url=${ANALYTICS_SERVICE_URL:http://localhost:8086}
