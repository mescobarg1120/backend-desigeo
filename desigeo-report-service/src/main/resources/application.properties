spring.application.name=desigeo-report-service
server.port=8082

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/desigeo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode=force_custom_plan

jwt.secret=${JWT_SECRET:change-this-secret-to-a-secure-value}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
firebase.project.id=${FIREBASE_PROJECT_ID}

supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}
