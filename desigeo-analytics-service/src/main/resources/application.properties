spring.application.name=desigeo-analytics-service
server.port=8086

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/desigeo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode=force_custom_plan

jwt.secret=${JWT_SECRET:change-this-secret-to-a-secure-value}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
