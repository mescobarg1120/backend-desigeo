# ─────────────────────────────────────────────
# application.properties para tests
# Sobreescribe el del main classpath — evita variables de entorno no resueltas
# ─────────────────────────────────────────────

spring.application.name=desigeo-analytics-service

# DataSource — H2 en memoria
spring.datasource.url=jdbc:h2:mem:analyticstest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT (dummy)
jwt.secret=test-secret-key-for-unit-tests-minimum-256-bits-padding-here-long-enough
jwt.expiration-seconds=3600

# Redis — excluido en tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
