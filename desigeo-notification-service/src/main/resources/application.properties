spring.application.name=desigeo-notification-service
server.port=8085

spring.config.import=optional:file:.env[.properties]

spring.jackson.serialization.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH}
firebase.project.id=${FIREBASE_PROJECT_ID}

user-service.url=${USER_SERVICE_URL}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}

spring.freemarker.check-template-location=false
