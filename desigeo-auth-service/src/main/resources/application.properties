spring.application.name=desigeo-auth-service
server.port=8081

# Database connection values must be provided via environment variables or a local secrets file.
# Do not commit real credentials or Supabase service keys to GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/desigeo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode=force_custom_plan

# Explicit dialect helps Hibernate when JDBC metadata is not available during startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:change-this-secret-to-a-secure-value}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Email (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App config
app.mail.from=${MAIL_FROM:noreply@desigeo.com}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
