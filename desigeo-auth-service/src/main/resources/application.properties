spring.application.name=desigeo-auth-service
server.port=8081

spring.config.import=optional:file:.env[.properties]

# Database connection values must be provided via environment variables or a local secrets file.
# Do not commit real credentials or Supabase service keys to GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode=force_custom_plan

# Explicit dialect helps Hibernate when JDBC metadata is not available during startup
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS}

# Email (SMTP)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App config
app.mail.from=${MAIL_FROM}
app.frontend.base-url=${FRONTEND_BASE_URL}
